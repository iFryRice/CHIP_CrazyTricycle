[project]
name = "patientphex-llm-runtime"
version = "0.1.0"
description = "Isolated, pinned Qwen3 extraction runtime for PatientPheX"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.6.0",
    "transformers==4.51.3",
    "peft==0.15.2",
    "accelerate==1.6.0",
    "safetensors==0.5.3",
    "scikit-learn==1.9.1",
    "numpy==2.5.3",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[project]
name = "patientphex-cpu"
version = "0.1.0"
description = "Reproducible CPU baseline for CHIP 2026 PatientPheX"
requires-python = ">=3.12,<3.13"
dependencies = ["scikit-learn>=1.5,<2"]

[project.optional-dependencies]
training = [
    "torch==2.6.0; sys_platform == 'linux' or sys_platform == 'win32'",
    "transformers==4.49.0",
    "safetensors>=0.4.3,<0.6",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
